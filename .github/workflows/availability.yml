  #       uses: appleboy/telegram-action@v1.0.0
  #       with:
  #         to: ${{ secrets.TELEGRAM_CHAT_ID }}
  #         token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  #         message: |
  #           ⚠️ Availability bot SKIPPED — no CI runs found on main.
  #     - name: Notify Telegram — Gate Failed
  #       if: steps.check.outputs.proceed == 'fail'
  #       uses: appleboy/telegram-action@v1.0.0
  #       with:
  #         to: ${{ secrets.TELEGRAM_CHAT_ID }}
  #         token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  #         message: |
  #           🚫 Availability bot SKIPPED — last CI run on main ${{ steps.check.outputs.conclusion }}.
  #           Fix: ${{ steps.check.outputs.run_url }}

  set-availability:
    # needs: gate
    # if: needs.gate.outputs.proceed == 'pass' || needs.gate.outputs.proceed == 'no_run'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Set availability
        id: run
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          STATUS_CHOICE: ${{ vars.STATUS_CHOICE }}
          PAGE_TIMEOUT: ${{ vars.PAGE_TIMEOUT }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
          RETRY_DELAY: ${{ vars.RETRY_DELAY }}
          WORK_SATURDAY: ${{ vars.WORK_SATURDAY }}
        run: python set_availability.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            final-status.png
            error-screenshot.png
          retention-days: 3

      - name: Check last CI status (informational only)
        id: ci-status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1,
            });
            if (runs.workflow_runs.length > 0) {
              core.setOutput('ci_conclusion', runs.workflow_runs[0].conclusion);
              core.setOutput('ci_url', runs.workflow_runs[0].html_url);
            } else {
              core.setOutput('ci_conclusion', 'no_runs');
            }

      - name: Build notification message
        id: notify
        run: |
          if [ "$(date +%u)" = "5" ]; then
            if [ "${{ vars.WORK_SATURDAY }}" = "true" ]; then
              echo "label=for Saturday and Monday" >> "$GITHUB_OUTPUT"
            else
              echo "label=for Monday (Saturday skipped)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "label=for tomorrow" >> "$GITHUB_OUTPUT"
          fi
          echo "status=${{ vars.STATUS_CHOICE }}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (Success)
        if: steps.run.outputs.result == 'success'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Availability set to "${{ steps.notify.outputs.status }}" ${{ steps.notify.outputs.label }}.
            CI on main: ${{ steps.ci-status.outputs.ci_conclusion }}
            ${{ steps.notify.outputs.timestamp }}
          disable_web_page_preview: true

      - name: Notify Telegram (Failure / Unknown)
        if: steps.run.outputs.result != 'success'
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Availability bot FAILED.
            CI on main: ${{ steps.ci-status.outputs.ci_conclusion }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          disable_web_page_preview: true
