name: Set Daily Availability

on:
  schedule:
    # 11:00 UTC = 7:00 AM ET (Mon-Fri). Adjust via crontab.guru.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  set-availability:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Set availability
        id: run
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          STATUS_CHOICE: ${{ secrets.STATUS_CHOICE }}
          PAGE_TIMEOUT: ${{ secrets.PAGE_TIMEOUT }}
          MAX_RETRIES: ${{ secrets.MAX_RETRIES }}
          RETRY_DELAY: ${{ secrets.RETRY_DELAY }}
        run: python set_availability.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            final-status.png
            error-screenshot.png
          retention-days: 3

      - name: Notify Telegram (Success)
        if: steps.run.outputs.result == 'success'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Availability set to "${{ secrets.STATUS_CHOICE }}" for tomorrow.
            $(date '+%Y-%m-%d %H:%M UTC')

      - name: Notify Telegram (Failure / Unknown)
        if: steps.run.outputs.result != 'success'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Availability bot FAILED.
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
