name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: check set_availability.py

  format-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check set_availability.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mypy playwright

      - run: mypy set_availability.py --ignore-missing-imports

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: >
          yamllint .github/workflows/
          --config-data "{
            extends: default,
            rules: {
              line-length: disable,
              document-start: disable,
              truthy: disable,
              comments-indentation: disable,
              trailing-spaces: {level: warning},
              indentation: {spaces: 2, indent-sequences: consistent}
            }
          }"
