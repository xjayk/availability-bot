name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: check set_availability.py

  format-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check set_availability.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install mypy playwright

      - run: mypy set_availability.py --ignore-missing-imports

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: >
          yamllint .github/workflows/
          --config-data "{
            extends: default,
            rules: {
              line-length: disable,
              document-start: disable,
              truthy: disable,
              comments-indentation: disable,
              trailing-spaces: {level: warning},
              indentation: {spaces: 2, indent-sequences: consistent}
            }
          }"

  notify:
    needs: [lint-python, format-python, type-check, lint-yaml]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status
        id: status
        run: |
          if [ "${{ needs.lint-python.result }}" = "success" ] && \
             [ "${{ needs.format-python.result }}" = "success" ] && \
             [ "${{ needs.type-check.result }}" = "success" ] && \
             [ "${{ needs.lint-yaml.result }}" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ steps.status.outputs.emoji }} CI ${{ steps.status.outputs.result }}
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            By: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          disable_web_page_preview: true
